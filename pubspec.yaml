name: ollama_gui
description: A lightweight desktop GUI for Ollama — run local AI models beautifully.
publish_to: "none"

version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.3.5

  # Routing
  go_router: ^14.6.3

  # HTTP / Streaming
  dio: ^5.8.0+1

  # Local database
  drift: ^2.23.1
  sqlite3_flutter_libs: ^0.5.26
  path_provider: ^2.1.5
  path: ^1.9.0

  # UI / Markdown / Code highlighting
  flutter_markdown: ^0.7.4
  markdown: ^7.2.2
  flutter_highlight: ^0.7.0
  google_fonts: ^6.2.1

  # Window management
  window_manager: ^0.4.3

  # Persistence
  shared_preferences: ^2.3.4

  # Utilities
  intl: ^0.19.0
  url_launcher: ^6.3.1
  file_picker: ^8.1.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.4.3
  drift_dev: ^2.23.1

flutter:
  uses-material-design: true

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono.ttf
